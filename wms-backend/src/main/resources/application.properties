# 服务端口配置
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
server.max-http-request-header-size=64KB
server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG
logging.level.com.example.wms=DEBUG
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT 相关配置
jwt.secret=ChangeThisToAStrongSecretKeyForJwtSigning123!
jwt.issuer=wms-backend
jwt.expiration-minutes=120
jwt.refresh-expiration-days=7

# 默认管理员账户配置
app.admin.username=admin
app.admin.password=password

# 默认租户配置
app.tenant.code=default
app.tenant.name=默认租户

# 默认环境
spring.profiles.active=dev

# 数据源公共配置（PostgreSQL）
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 初始化脚本配置（改用 Flyway 管理数据库迁移）
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG










# Spring Boot 基础配置
spring.main.banner-mode=off

# 监控与导出配置
wms.monitor.slow-request-ms=1000
wms.monitor.sql-timing-enabled=false
wms.monitor.sql-timing-log-params=false
wms.monitor.slow-query-ms=500
wms.audit.export-max=5000
wms.idempotency.ttl-seconds=1
wms.qz.certificate-path=classpath:qz/qz-dev-cert.pem
wms.qz.keystore-path=classpath:qz/qz-dev.pfx
wms.qz.keystore-password=QzDevPfxPassword!2026
