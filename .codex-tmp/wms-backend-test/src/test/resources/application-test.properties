# Test profile datasource (H2 in PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:wms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Ensure schema.sql is applied
spring.sql.init.mode=always

# JWT settings for tests
jwt.secret=ChangeThisToAStrongSecretKeyForJwtSigning123!
jwt.issuer=wms-backend
jwt.expiration-minutes=120
jwt.refresh-expiration-days=7

# Default admin account for tests
app.admin.username=admin
app.admin.password=password

# Default tenant for tests
app.tenant.code=default
app.tenant.name=默认租户
